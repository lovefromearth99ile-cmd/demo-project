name: Aurora CI

on:
  push:
    paths:
      - "aurora-ai/**"
      - ".github/workflows/aurora-ci.yml"
  pull_request:
    paths:
      - "aurora-ai/**"
      - ".github/workflows/aurora-ci.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: aurora-ai
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Build Aurora
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: 1
